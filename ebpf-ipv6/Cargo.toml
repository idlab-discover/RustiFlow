[package]
name = "ebpf-ipv6"
version = "0.1.0"
edition = "2021"

[features]
dual-stack = []
xdp-experiment = []

[dependencies]
aya-ebpf = "0.3.0"
common = { path = "../common" }
zerocopy = { version = "0.8.63", default-features = false }

[[bin]]
name = "rustiflow-ebpf-ipv6"
path = "src/main.rs"

[[bin]]
name = "rustiflow-ebpf-dual-stack"
path = "src/dual_stack.rs"
required-features = ["dual-stack"]

[[bin]]
name = "rustiflow-ebpf-ingress-experiment"
path = "src/ingress_experiment.rs"
required-features = ["xdp-experiment"]

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[workspace]
members = []
