[package]
name = "ebpf-ipv6"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = "0.2.1"
aya-log-ebpf = "0.2.0"
common = { path = "../common" }
network-types = { version = "0.2.0", default-features = false }
num-traits = { version = "0.2.19", default-features = false }

[[bin]]
name = "rustiflow-ebpf-ipv6"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[workspace]
members = []
