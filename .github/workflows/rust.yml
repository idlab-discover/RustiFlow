name: Rust Aya eBPF CI

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src, clippy
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev zstd
      
    - name: Install bpf-linker
      # Use the upstream binary; source builds require a matching system LLVM.
      run: |
        curl -fL --retry 3 https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst -o "$RUNNER_TEMP/bpf-linker.tar.zst"
        tar --zstd -xf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$HOME/.cargo/bin"
        bpf-linker --version

    - name: Build eBPF program ipv4
      run: cargo xtask ebpf-ipv4

    - name: Build eBPF program ipv6
      run: cargo xtask ebpf-ipv6

    - name: Build userspace program
      run: cargo build --verbose

    - name: Run Clippy
      run: cargo clippy -p rustiflow --all-targets -- -D warnings

    - name: Fetch gh-pages branch
      run: git fetch origin gh-pages:gh-pages

    - name: Backup custom index.html
      run: |
        git checkout gh-pages
        mv index.html index.html.backup
        git checkout -
      
    - name: Run tests
      run: cargo test --verbose
      
    - name: Generate documentation
      run: cargo doc --no-deps

    - name: Restore custom index.html
      run: mv index.html.backup target/doc/index.html

    - name: Push docs to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc
        publish_branch: gh-pages
