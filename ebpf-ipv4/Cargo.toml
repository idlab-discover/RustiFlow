[package]
name = "ebpf-ipv4"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = "0.3.0"
common = { path = "../common" }
zerocopy = { version = "0.8.63", default-features = false }

[[bin]]
name = "rustiflow-ebpf-ipv4"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[workspace]
members = []
